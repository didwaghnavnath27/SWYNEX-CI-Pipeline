name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Check HTML files
        run: |
          test -f index.html
          test -f timer.html
          echo "HTML files found successfully"

      - name: Check CSS file
        run: |
          test -f tooplate-ivory-style.css
          echo "CSS file found successfully"

      - name: Check JavaScript file
        run: |
          test -f tooplate-ivory-script.js
          echo "JavaScript file found successfully"

      - name: Check images folder
        run: |
          test -d images
          test "$(find images -type f | wc -l)" -gt 0
          echo "Images found successfully"

      - name: Build check
        run: |
          echo "Project structure checked successfully"
          echo "CI Pipeline completed successfully"